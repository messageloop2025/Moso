# 毛竹（Moso）反向代理示例（HTTPS + MCP Streamable HTTP）
# 要点：
# 1. 传递 X-Forwarded-Proto，避免应用层重定向降级为 http
# 2. /mcp 与 /mcp/ 均直接 proxy_pass，不要用 return 307 跳到 http
# 3. MCP 为 SSE/长连接，需 proxy_buffering off

upstream edgeops_app {
    server 127.0.0.1:8010;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name ops.example.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 64m;

    location / {
        proxy_pass http://edgeops_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # MCP：无尾斜杠与有尾斜杠都直接转发（应用内也会规范化 /mcp -> /mcp/）
    location = /mcp {
        proxy_pass http://edgeops_app/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /mcp/ {
        proxy_pass http://edgeops_app/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
