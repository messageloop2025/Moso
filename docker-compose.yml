# 毛竹（Moso）— 从 Docker Hub 拉取镜像部署（项目根目录执行）
#
# 1. 复制 docker-hub.env.example 为 docker-hub.env，填写 DOCKERHUB_USER（与 publish-docker-hub.bat 一致）
# 2. 可选：设置 MOSO_IMAGE_TAG=1.3.8-sp1（默认 latest）
#
#   docker compose --env-file docker-hub.env pull
#   docker compose --env-file docker-hub.env up -d
#
# （若把 docker-hub.env 复制为 .env，可省略 --env-file）
#
# 数据卷（相对本文件所在目录）：
#   ./data/data  → /app/data   （SQLite）
#   ./data/fs    → /app/web/fs （用户文件、附件、Skills）
#   ./data/logs  → /app/logs   （运行日志）
#
# 本地源码构建请用：docker compose -f docker/docker-compose.yml up -d --build

services:
  moso:
    image: messageloop/moso:latest
    container_name: moso
    ports:
      - "${EDGEOPS_PORT:-8010}:8010"
    environment:
      EDGEOPS_DB: /app/data/edgeops.db
      EDGEOPS_HOST: "0.0.0.0"
      EDGEOPS_PORT: "8010"
      EDGEOPS_VERSION: ${MOSO_IMAGE_TAG:-latest}
      EDGEOPS_MCP_ENABLED: ${EDGEOPS_MCP_ENABLED:-true}
      EDGEOPS_MCP_HOST: ${EDGEOPS_MCP_HOST:-0.0.0.0}
      EDGEOPS_MCP_PORT: ${EDGEOPS_MCP_PORT:-8011}
      EDGEOPS_MCP_HTTP_PATH: ${EDGEOPS_MCP_HTTP_PATH:-/mcp}
      EDGEOPS_MCP_API_BASE_URL: ${EDGEOPS_MCP_API_BASE_URL:-http://127.0.0.1:8010}
      EDGEOPS_MCP_ACCESS_TOKEN: ${EDGEOPS_MCP_ACCESS_TOKEN:-}
      EDGEOPS_TRUST_PROXY_HEADERS: ${EDGEOPS_TRUST_PROXY_HEADERS:-true}
      EDGEOPS_TRUSTED_PROXY_HOSTS: ${EDGEOPS_TRUSTED_PROXY_HOSTS:-*}
      EDGEOPS_SECRET: ${EDGEOPS_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - ./data/data:/app/data
      - ./data/fs:/app/web/fs
      - ./data/logs:/app/logs
    restart: unless-stopped
